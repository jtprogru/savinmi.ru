---
name: ci
'on':
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            src/pages/*.md
            README.md

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Пингуем IndexNow после деплоя: Яндекс и Bing переобходят быстрее,
  # чем по расписанию sitemap. Ключ публичный по протоколу — лежит в
  # public/<key>.txt и отдаётся с https://savinmi.ru/<key>.txt
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: jtprogru/indexnow@v0.7.0
        with:
          key: 33c7060bc5ff8fd6fc60d681b6a38d2c
          host: savinmi.ru
          sitemap: https://savinmi.ru/sitemap-index.xml
