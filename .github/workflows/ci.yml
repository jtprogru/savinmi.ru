---
name: ci
'on':
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: make lint

  # Граф зависимостей GitHub не умеет читать bun.lock: без этого шага в нём
  # видны только прямые зависимости из package.json, а алерты по транзитивным
  # CVE не приходят. Отдаём полное дерево через Dependency Submission API.
  dependency-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: make dependency-snapshot
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots" \
            --input dependency-snapshot.json

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      # Дизайн-система приезжает сабмодулем vendor/mishka-ds. Собранного CSS
      # в её репозитории нет — dist/ там в .gitignore, — поэтому пакет
      # собирается прямо здесь своим npm. Это делает make build, ему нужен
      # только node рядом с bun.
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vendor/mishka-ds/package-lock.json
      - run: make build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Пингуем IndexNow после деплоя: Яндекс и Bing переобходят быстрее,
  # чем по расписанию sitemap. Ключ публичный по протоколу — лежит в
  # public/<key>.txt и отдаётся с https://savinmi.ru/<key>.txt
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: jtprogru/indexnow@v0.7.2
        with:
          key: 33c7060bc5ff8fd6fc60d681b6a38d2c
          host: savinmi.ru
          sitemap: https://savinmi.ru/sitemap-index.xml

  # Итог пайплайна в Telegram. Отдельным job, а не шагом: жобов пять,
  # и job.status внутри любого из них не отражает общий результат.
  notify:
    needs: [lint, dependency-graph, build, deploy, indexnow]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - id: telegram
        uses: jtprogru/notiflow@v1.6.1
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_USER_ID }}
          status: >-
            ${{ contains(needs.*.result, 'failure') && 'failure'
            || contains(needs.*.result, 'cancelled') && 'cancelled'
            || 'success' }}
          message_template: |
            *Deploy status*: {{.StatusEmoji}}
            *Project*: `{{.Repo}}`
            *Runs on*: {{.ServerUrl}}/{{.Repo}}/tree/{{.Sha}}
            *Branch*: `{{.Ref}}`

      # notiflow по умолчанию не роняет job при отказе доставки, а в лог
      # на успехе ничего не пишет. Без этого шага неверный chat_id или
      # отсутствие прав у бота выглядят как зелёный прогон без сообщения.
      - name: Check delivery
        if: always()
        env:
          OK: ${{ steps.telegram.outputs.ok }}
          HTTP: ${{ steps.telegram.outputs.http_status }}
          ERR: ${{ steps.telegram.outputs.error }}
        run: |
          if [ "$OK" = "true" ]; then
            echo "Telegram: доставлено, message_id=${{ steps.telegram.outputs.message_id }}"
          else
            echo "::warning title=Telegram::не доставлено (HTTP ${HTTP:-?}): ${ERR:-причина не указана}"
          fi
